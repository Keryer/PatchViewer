[workspace]
members = [
    "crates/patch-viewer-core",
    "crates/patch-viewer-cli",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = { version = "2.6", features = ["inline"] }
regex = "1.10"
once_cell = "1.19"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"

[profile.release]
strip = true
lto = "thin"
